<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thiệp Xin Lỗi Động</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <style>
    :root {
      --desk-dark: #5a3925;
      --desk-mid: #7a5238;
      --desk-light: #9a6b4a;
      --melancholy-blue: rgba(125, 148, 176, 0.18);
      --mist: rgba(198, 215, 236, 0.1);
      --vignette: rgba(11, 7, 5, 0.42);
      --paper: #f5ecd3;
      --paper-deep: #efe2bf;
      --line: rgba(95, 121, 173, 0.38);
      --margin-line: rgba(186, 87, 74, 0.58);
      --ink: #3e2f22;
      --cover: #7f5b45;
      --cover-dark: #634433;
      --spine: #4d3325;
      --shadow: rgba(22, 12, 8, 0.4);
      --highlight: rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Patrick Hand", cursive;
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.1), transparent 26%),
        radial-gradient(circle at 82% 74%, rgba(255, 255, 255, 0.08), transparent 30%),
        repeating-linear-gradient(
          20deg,
          rgba(50, 31, 20, 0.16) 0 2px,
          rgba(255, 255, 255, 0.025) 2px 6px,
          transparent 6px 14px
        ),
        linear-gradient(160deg, var(--desk-dark), var(--desk-mid) 50%, var(--desk-light));
      display: grid;
      place-items: center;
      perspective: 2400px;
      filter: saturate(0.9) brightness(0.95);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: 1;
      background:
        radial-gradient(circle at 24% 18%, var(--melancholy-blue), transparent 46%),
        radial-gradient(circle at 72% 82%, rgba(170, 195, 220, 0.11), transparent 44%),
        radial-gradient(circle at 50% 50%, transparent 35%, var(--vignette) 100%);
      animation: moodShift 14s ease-in-out infinite alternate;
    }

    body::after {
      z-index: 3;
      opacity: 0.38;
      background:
        repeating-linear-gradient(
          108deg,
          rgba(212, 226, 245, 0.26) 0 1px,
          transparent 1px 24px
        );
      background-size: 160px 220px;
      animation: rainFall 16s linear infinite;
    }

    .intro {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 30;
      padding: 24px;
      text-align: center;
      background: linear-gradient(150deg, rgba(42, 25, 17, 0.78), rgba(20, 10, 7, 0.62));
      backdrop-filter: blur(2px);
      transition: opacity 1.4s ease, visibility 1.4s ease;
    }

    .intro h1 {
      font-family: "Caveat", cursive;
      color: #f6e8d0;
      font-size: clamp(2rem, 6.5vw, 4.8rem);
      letter-spacing: 0.06em;
      text-shadow:
        0 2px 1px rgba(0, 0, 0, 0.35),
        0 16px 32px rgba(0, 0, 0, 0.42);
    }

    .intro.hide {
      opacity: 0;
      visibility: hidden;
    }

    .scene {
      width: min(94vw, 980px);
      aspect-ratio: 16 / 10;
      position: relative;
      display: grid;
      place-items: center;
      z-index: 10;
      opacity: 0;
      transform: translateY(20px) scale(0.985);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 3% 2% 6%;
      border-radius: 18px;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse at 18% 16%, var(--mist), transparent 56%),
        radial-gradient(ellipse at 78% 80%, rgba(181, 206, 232, 0.08), transparent 62%);
      mix-blend-mode: screen;
      animation: mistFlow 11s ease-in-out infinite;
    }

    .scene.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .floating-icons {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    .float-icon {
      position: absolute;
      font-size: clamp(1.05rem, 2vw, 1.5rem);
      opacity: 0.75;
      filter: drop-shadow(0 2px 8px rgba(13, 8, 6, 0.28));
      animation: iconDrift 7.2s ease-in-out infinite;
      user-select: none;
    }

    .float-icon.sad {
      color: rgba(214, 226, 242, 0.92);
    }

    .float-icon.heart {
      color: rgba(246, 178, 167, 0.95);
    }

    .floating-icons .float-icon:nth-child(1) {
      left: 5%;
      top: 20%;
      animation-delay: -1.1s;
    }

    .floating-icons .float-icon:nth-child(2) {
      left: 13%;
      top: 62%;
      animation-delay: -4.4s;
    }

    .floating-icons .float-icon:nth-child(3) {
      right: 10%;
      top: 18%;
      animation-delay: -2.7s;
    }

    .floating-icons .float-icon:nth-child(4) {
      right: 6%;
      top: 56%;
      animation-delay: -5.2s;
    }

    .floating-icons .float-icon:nth-child(5) {
      left: 46%;
      top: 7%;
      animation-delay: -3.3s;
    }

    .flip-controls {
      position: absolute;
      left: 50%;
      bottom: clamp(-58px, -7vw, -38px);
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 18;
    }

    .flip-controls.show {
      opacity: 1;
      pointer-events: auto;
    }

    .flip-btn {
      border: 1px solid rgba(248, 225, 191, 0.3);
      background: linear-gradient(165deg, rgba(57, 36, 25, 0.72), rgba(28, 17, 12, 0.72));
      color: #f0dfc3;
      font-family: "Patrick Hand", cursive;
      font-size: clamp(0.9rem, 1.4vw, 1.05rem);
      padding: 8px 14px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      cursor: pointer;
      backdrop-filter: blur(2px);
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .flip-btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .flip-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .book {
      width: min(90vw, 920px);
      aspect-ratio: 16 / 10;
      position: relative;
      transform-style: preserve-3d;
      filter: drop-shadow(0 30px 22px rgba(30, 15, 10, 0.32));
      animation: slowSway 8s ease-in-out infinite;
    }

    .book.can-flip {
      cursor: ew-resize;
    }

    .book::after {
      content: "";
      position: absolute;
      inset: auto 4% -7%;
      height: 12%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5), transparent 68%);
      transform: translateZ(-80px);
      pointer-events: none;
      z-index: -1;
    }

    .back-cover {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background:
        linear-gradient(130deg, #8e6651 5%, var(--cover) 42%, var(--cover-dark) 100%),
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.06) 0 3px,
          rgba(0, 0, 0, 0.05) 3px 7px
        );
      box-shadow:
        inset 0 0 0 2px rgba(255, 236, 206, 0.16),
        inset -14px -18px 24px rgba(46, 24, 15, 0.23);
    }

    .spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(50% - 16px);
      width: 32px;
      border-radius: 9px;
      background:
        linear-gradient(90deg, #2f1b12 0%, #533827 35%, #392217 70%, #2a1911 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 224, 187, 0.18),
        0 0 18px rgba(28, 12, 8, 0.35);
      transform: translateZ(6px);
    }

    .page-spread {
      position: absolute;
      inset: 2.2% 2.2%;
      border-radius: 9px;
      overflow: hidden;
      display: flex;
      transform-style: preserve-3d;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .book.open .page-spread {
      opacity: 1;
    }

    .left-page-base,
    .right-page-stack {
      width: 50%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .paper {
      position: absolute;
      inset: 0;
      border-radius: 3px;
      background:
        radial-gradient(circle at 15% 8%, rgba(255, 255, 255, 0.38), transparent 35%),
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 27px,
          var(--line) 28px,
          transparent 29px
        ),
        linear-gradient(180deg, var(--paper), var(--paper-deep));
      box-shadow:
        inset 0 0 0 1px rgba(171, 146, 101, 0.25),
        inset -20px 0 24px rgba(124, 102, 67, 0.12);
    }

    .paper::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: clamp(16px, 3vw, 28px);
      width: 2px;
      background: var(--margin-line);
      opacity: 0.8;
    }

    .left-page-base .paper {
      box-shadow:
        inset 0 0 0 1px rgba(171, 146, 101, 0.24),
        inset 18px 0 20px rgba(138, 112, 76, 0.16);
    }

    .left-page-note {
      position: absolute;
      left: clamp(36px, 5vw, 54px);
      top: 16%;
      right: 10%;
      color: rgba(74, 54, 35, 0.5);
      font-family: "Caveat", cursive;
      font-size: clamp(1.3rem, 2.3vw, 2rem);
      line-height: 1.55;
      pointer-events: none;
    }

    .left-page-note span {
      display: block;
      opacity: 0.86;
    }

    .page {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.8s cubic-bezier(0.2, 0.76, 0.22, 1);
      will-change: transform;
      box-shadow: 0 10px 22px rgba(47, 28, 16, 0.18);
      z-index: 12;
    }

    .page[data-page="1"] { z-index: 14; }
    .page[data-page="2"] { z-index: 13; }
    .page[data-page="3"] { z-index: 12; }
    .page[data-page="4"] { z-index: 11; }

    .page-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .page-face.back {
      transform: rotateY(180deg);
      filter: brightness(0.98);
    }

    .page.flipped {
      transform: rotateY(-180deg);
      box-shadow: -16px 8px 16px rgba(38, 19, 11, 0.2);
    }

    .message {
      position: absolute;
      top: 16%;
      left: clamp(32px, 4vw, 42px);
      right: clamp(22px, 2.8vw, 32px);
      font-family: "Patrick Hand", cursive;
      font-size: clamp(1.15rem, 1.95vw, 2rem);
      line-height: 1.55;
      color: #412f20;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .message p {
      min-height: 1.6em;
      margin-bottom: 0.35em;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message p.written {
      animation: inkSettle 0.85s ease both;
    }

    .typing::after {
      content: "|";
      display: inline-block;
      margin-left: 1px;
      color: rgba(52, 32, 18, 0.8);
      animation: blink 0.85s steps(1) infinite;
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .front-cover {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.8s cubic-bezier(0.16, 0.78, 0.2, 1.01);
      z-index: 20;
      background:
        linear-gradient(125deg, #9d745d 0%, #85614c 43%, #684937 100%),
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.07) 0 2px,
          rgba(34, 20, 13, 0.06) 2px 7px
        );
      box-shadow:
        inset 0 0 0 2px rgba(255, 232, 199, 0.17),
        inset -20px -10px 28px rgba(50, 26, 16, 0.28),
        0 18px 26px rgba(22, 12, 7, 0.35);
      display: grid;
      place-items: center;
      padding: 26px;
    }

    .front-cover::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 6px;
      border: 1px solid rgba(249, 224, 192, 0.25);
      pointer-events: none;
    }

    .cover-title {
      text-align: center;
      color: #f1debf;
      text-transform: uppercase;
      font-family: "Caveat", cursive;
      font-size: clamp(1.9rem, 3.2vw, 3rem);
      letter-spacing: 0.06em;
      line-height: 1.15;
      text-shadow:
        0 1px 1px rgba(0, 0, 0, 0.25),
        0 10px 20px rgba(0, 0, 0, 0.32);
      transform: translateZ(10px);
      max-width: 85%;
    }

    .cover-sub {
      margin-top: 16px;
      font-family: "Patrick Hand", cursive;
      font-size: clamp(1.05rem, 1.8vw, 1.45rem);
      opacity: 0.86;
      letter-spacing: 0.03em;
    }

    .cover-title {
      animation: titlePulse 4.6s ease-in-out infinite;
    }

    .book.open .front-cover {
      transform: rotateY(-172deg);
      box-shadow:
        -8px 14px 18px rgba(26, 12, 7, 0.3),
        inset -20px -10px 20px rgba(30, 16, 10, 0.22);
    }

    @media (max-width: 900px) {
      .scene {
        width: 100vw;
      }

      .book {
        width: min(96vw, 820px);
      }

      .left-page-note {
        opacity: 0.7;
      }
    }

    @media (max-width: 640px) {
      .book {
        aspect-ratio: 13 / 10;
      }

      .float-icon {
        font-size: clamp(0.95rem, 3.2vw, 1.2rem);
      }

      .message {
        top: 13%;
        left: 24px;
        right: 16px;
        font-size: clamp(1.05rem, 3.9vw, 1.38rem);
      }

      .left-page-note {
        top: 13%;
        left: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after,
      .scene::before,
      .book,
      .cover-title,
      .message p.written,
      .float-icon {
        animation: none !important;
      }
    }

    @keyframes rainFall {
      from { transform: translate3d(0, -16%, 0); }
      to { transform: translate3d(0, 20%, 0); }
    }

    @keyframes moodShift {
      from { opacity: 0.9; }
      to { opacity: 1; }
    }

    @keyframes mistFlow {
      0%, 100% { transform: translateX(-1.5%) scale(1); opacity: 0.7; }
      50% { transform: translateX(1.8%) scale(1.02); opacity: 0.95; }
    }

    @keyframes slowSway {
      0%, 100% { transform: rotateZ(-0.55deg) translateY(0); }
      50% { transform: rotateZ(0.55deg) translateY(-3px); }
    }

    @keyframes titlePulse {
      0%, 100% { letter-spacing: 0.06em; opacity: 0.92; }
      50% { letter-spacing: 0.075em; opacity: 1; }
    }

    @keyframes inkSettle {
      from {
        opacity: 0;
        transform: translateY(7px);
        filter: blur(1.2px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes iconDrift {
      0%, 100% {
        transform: translateY(0) scale(1) rotate(-4deg);
        opacity: 0.72;
      }
      50% {
        transform: translateY(-11px) scale(1.05) rotate(4deg);
        opacity: 0.95;
      }
    }
  </style>
</head>
<body>
  <section class="intro" id="intro">
    <h1>TẤM THIỆP AN ỦI TỪ ĐÁY LÒNG</h1>
  </section>

  <main class="scene" id="scene" aria-live="polite">
    <div class="floating-icons" aria-hidden="true">
      <span class="float-icon sad">😢</span>
      <span class="float-icon heart">💔</span>
      <span class="float-icon sad">🥺</span>
      <span class="float-icon heart">❤️</span>
      <span class="float-icon heart">🤍</span>
    </div>

    <div class="book" id="book">
      <div class="back-cover"></div>
      <div class="spine"></div>

      <div class="page-spread">
        <div class="left-page-base">
          <div class="paper"></div>
          <div class="left-page-note">
            <span>những dòng này... 😢</span>
            <span>đều là lời thật lòng ❤️</span>
          </div>
        </div>

        <div class="right-page-stack">
          <article class="page" data-page="1">
            <div class="page-face front">
              <div class="paper"></div>
              <div class="message">
                <p id="p1l1"></p>
                <p id="p1l2"></p>
              </div>
            </div>
            <div class="page-face back">
              <div class="paper"></div>
            </div>
          </article>

          <article class="page" data-page="2">
            <div class="page-face front">
              <div class="paper"></div>
              <div class="message">
                <p id="p2l1"></p>
              </div>
            </div>
            <div class="page-face back">
              <div class="paper"></div>
            </div>
          </article>

          <article class="page" data-page="3">
            <div class="page-face front">
              <div class="paper"></div>
              <div class="message">
                <p id="p3l1"></p>
              </div>
            </div>
            <div class="page-face back">
              <div class="paper"></div>
            </div>
          </article>

          <article class="page" data-page="4">
            <div class="page-face front">
              <div class="paper"></div>
              <div class="message">
                <p id="p4l1"></p>
              </div>
            </div>
            <div class="page-face back">
              <div class="paper"></div>
            </div>
          </article>
        </div>
      </div>

      <div class="front-cover" id="frontCover" aria-hidden="true">
        <div class="cover-title">
          Sổ Tay Xin Lỗi
          <div class="cover-sub">viết bằng cả trái tim</div>
        </div>
      </div>
    </div>

    <div class="flip-controls" id="flipControls" aria-label="Điều khiển lật trang">
      <button class="flip-btn" id="prevBtn" type="button">← Trang trước</button>
      <button class="flip-btn" id="nextBtn" type="button">Trang sau →</button>
    </div>
  </main>

  <script>
    const intro = document.getElementById("intro");
    const scene = document.getElementById("scene");
    const book = document.getElementById("book");
    const flipControls = document.getElementById("flipControls");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const totalPages = 4;
    let currentPage = 1;
    let isInteractive = false;
    let flipLocked = false;

    const pageEls = {
      1: document.querySelector('.page[data-page="1"]'),
      2: document.querySelector('.page[data-page="2"]'),
      3: document.querySelector('.page[data-page="3"]'),
      4: document.querySelector('.page[data-page="4"]')
    };

    const lineEls = {
      p1l1: document.getElementById("p1l1"),
      p1l2: document.getElementById("p1l2"),
      p2l1: document.getElementById("p2l1"),
      p3l1: document.getElementById("p3l1"),
      p4l1: document.getElementById("p4l1")
    };

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function updateFlipButtons() {
      prevBtn.disabled = !isInteractive || currentPage <= 1 || flipLocked;
      nextBtn.disabled = !isInteractive || currentPage >= totalPages || flipLocked;
    }

    function enableManualFlip() {
      isInteractive = true;
      book.classList.add("can-flip");
      flipControls.classList.add("show");
      updateFlipButtons();
    }

    async function goToPage(targetPage) {
      const target = Math.max(1, Math.min(totalPages, targetPage));
      if (!isInteractive || flipLocked || target === currentPage) return;

      flipLocked = true;
      updateFlipButtons();

      while (currentPage < target) {
        pageEls[currentPage].classList.add("flipped");
        currentPage += 1;
        await sleep(900);
      }

      while (currentPage > target) {
        pageEls[currentPage - 1].classList.remove("flipped");
        currentPage -= 1;
        await sleep(900);
      }

      flipLocked = false;
      updateFlipButtons();
    }

    async function typeWriter(element, text, baseSpeed = 68) {
      element.textContent = "";
      element.classList.remove("written");
      element.classList.add("typing");

      for (const char of text) {
        element.textContent += char;
        const jitter = Math.random() * 35 - 12;
        await sleep(Math.max(28, baseSpeed + jitter));
      }

      element.classList.remove("typing");
      element.classList.add("written");
    }

    async function flipToNext(pageNumber) {
      const page = pageEls[pageNumber];
      if (!page) return;

      page.classList.add("flipped");
      currentPage = Math.min(totalPages, pageNumber + 1);
      await sleep(1900);
    }

    async function runSequence() {
      await sleep(5000);
      intro.classList.add("hide");

      await sleep(1200);
      scene.classList.add("show");

      await sleep(900);
      book.classList.add("open");

      await sleep(1800);

      await typeWriter(lineEls.p1l1, "Xin chào Lê Tịnh Nghi", 78);
      await sleep(1000);
      await typeWriter(
        lineEls.p1l2,
        "anh biết em đang rất buồn vì nhiều chuyện, anh mong em sớm vượt qua được những chuyện đó",
        54
      );

      await sleep(1800);
      await flipToNext(1);
      await sleep(320);

      await typeWriter(lineEls.p2l1, "anh mong em sớm vui vẻ, đáng iu", 64);

      await sleep(1700);
      await flipToNext(2);
      await sleep(300);

      await typeWriter(lineEls.p3l1, "Vui lên, cố lên Lê Tịnh Nghi 🥺", 70);

      await sleep(1700);
      await flipToNext(3);
      await sleep(320);

      await typeWriter(
        lineEls.p4l1,
        "Xin lỗi chiều làm gì em buồn nha 😢 Thành thật Xin Lỗi bằng cả trái tim ❤️",
        56
      );

      await sleep(600);
      enableManualFlip();
    }

    prevBtn.addEventListener("click", () => {
      goToPage(currentPage - 1);
    });

    nextBtn.addEventListener("click", () => {
      goToPage(currentPage + 1);
    });

    book.addEventListener("click", (event) => {
      if (!isInteractive || flipLocked) return;

      const rect = book.getBoundingClientRect();
      const isLeftHalf = event.clientX < rect.left + rect.width / 2;
      goToPage(currentPage + (isLeftHalf ? -1 : 1));
    });

    window.addEventListener("keydown", (event) => {
      if (!isInteractive || flipLocked) return;

      if (event.key === "ArrowLeft") {
        goToPage(currentPage - 1);
      }

      if (event.key === "ArrowRight") {
        goToPage(currentPage + 1);
      }
    });

    window.addEventListener("load", runSequence);
  </script>
</body>
</html>
